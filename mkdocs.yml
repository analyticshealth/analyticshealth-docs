site_name: AnalyticsHealth – Architecture Docs
site_description: Technical architecture documentation for the AnalyticsHealth platform
site_author: Lucas Maistro

theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: lime
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - admonition
  - tables
  - attr_list

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

nav:
  - Home: index.md
  - Produto & Objetivos: product.md
  - Vision: vision.md
  - Architecture:
      - Overview: architecture/overview.md
      - Diagrams: architecture/diagram.md
      - Ingestion: architecture/ingestion.md
      - Data Lake: architecture/data-lake.md
      - RAG & Bedrock: architecture/rag-bedrock.md
      - Multi-Tenant Security: architecture/security-multitenant.md
      - CI/CD Pipeline: architecture/cicd.md
      - Constants Pattern: architecture/constants.md
      - Gotchas: architecture/gotchas.md
  - Cost:
      - Baseline: cost/baseline.md
      - Scaling: cost/scaling.md
  - Decisions:
      - ADR 0001 – Vector Store: decisions/adr-0001-pgvector-vs-opensearch.md
      - ADR 0002 – Region: decisions/adr-0002-region-eu-west-1.md
      - ADR 0003 – LLM Model: decisions/adr-0003-llm-claude-sonnet.md
      - ADR 0004 – No Fallback: decisions/adr-0004-no-model-fallback.md
      - ADR 0005 – RDS vs Aurora: decisions/adr-0005-rds-provisioned-vs-aurora.md
      - ADR 0006 – SAM vs CDK for Lambdas: decisions/adr-0006-sam-vs-cdk-for-lambdas.md
  - Roadmap: roadmap.md
